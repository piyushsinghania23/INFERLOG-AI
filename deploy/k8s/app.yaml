apiVersion: v1
kind: Service
metadata:
  name: inferlog-app
  namespace: inferlog
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: inferlog-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inferlog-app
  namespace: inferlog
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inferlog-app
  template:
    metadata:
      labels:
        app: inferlog-app
    spec:
      containers:
        - name: app
          image: inferlog-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: postgresql+psycopg://inferlog:inferlog@inferlog-postgres:5432/inferlog
            - name: INGESTION_URL
              value: http://inferlog-app:8000/api/ingest/inference
            - name: DEFAULT_PROVIDER
              value: openai
            - name: DEFAULT_MODEL
              value: gpt-4.1-mini
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: inferlog-secrets
                  key: openai-api-key
                  optional: true
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: inferlog-secrets
                  key: anthropic-api-key
                  optional: true
